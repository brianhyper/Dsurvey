name: plant-survey

# Plant Stimulant Use Survey — KMTC Nakuru
# Node + Express + PostgreSQL. Port 3004, tunneled by Cloudflare.
#
# Usage:
#   cp .env.example .env      # then edit values
#   docker compose up -d --build
#   docker compose logs -f app

services:
  db:
    image: postgres:16-alpine
    container_name: survey_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    build: .
    image: plant-survey:latest
    container_name: survey_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true} 

    # Loopback only. Cloudflare Tunnel points at http://localhost:3004.
    ports:
      - "127.0.0.1:${APP_PORT:-3004}:3000"

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    

    networks:
      - internal

volumes:
  pgdata:

networks:
  internal: